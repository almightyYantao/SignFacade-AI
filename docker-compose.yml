services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    volumes:
      - backend-data:/app-data
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      macvlan:
        ipv4_address: 192.168.220.158

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      # 修改这里即可切换前端反代的后端地址（不要带末尾 /）
      BACKEND_URL: ${BACKEND_URL:-http://192.168.220.158:8080}
    networks:
      macvlan:
        ipv4_address: 192.168.220.157

networks:
  macvlan:
    external: true

volumes:
  backend-data:
